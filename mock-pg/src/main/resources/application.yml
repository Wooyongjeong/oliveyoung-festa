spring:
  application:
    name: festa-mock-pg
  datasource:
    url: ${MOCK_PG_DATABASE_URL:jdbc:h2:file:/tmp/festa-mock-pg;AUTO_SERVER=TRUE}
    username: sa
    password:
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  port: ${SERVER_PORT:8081}
